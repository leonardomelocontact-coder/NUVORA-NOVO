<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto | NUVORA</title><style>:root{--bg:#08050c;--card:#130b1d;--purple:#9b5cff;--purple2:#d0a8ff;--text:#f7f1fb;--muted:#a99caf;--line:rgba(197,154,255,.17)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 10%,rgba(155,92,255,.14),transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}.top{border-bottom:1px solid var(--line);background:rgba(8,5,12,.86)}.nav{max-width:1100px;margin:auto;padding:17px 20px;display:flex;justify-content:space-between}.logo{font:600 25px Georgia,serif}.logo span{color:var(--purple2)}.back{font-size:13px;color:#d8cedd}.wrap{max-width:1050px;margin:auto;padding:55px 20px 80px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.visual{min-height:500px;border:1px solid var(--line);border-radius:25px;background:radial-gradient(circle,rgba(197,154,255,.22),transparent 48%),linear-gradient(145deg,#160b22,#09060d);display:flex;align-items:center;justify-content:center}.icon{font-size:170px;filter:drop-shadow(0 25px 25px rgba(0,0,0,.55));animation:f 3s ease-in-out infinite}@keyframes f{50%{transform:translateY(-12px)}}.cat,.tag{color:var(--purple2);font-size:11px;text-transform:uppercase;letter-spacing:2px}.tag{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:20px;background:rgba(155,92,255,.14);margin-bottom:12px}.info h1{font:400 50px Georgia,serif;margin:10px 0}.desc{color:var(--muted);line-height:1.7}.price{font:400 35px Georgia,serif;color:#eadcff;margin:28px 0}.buy{display:block;text-align:center;background:linear-gradient(135deg,#9b5cff,#6f35cf);padding:16px;border-radius:13px;font-weight:800}.note{font-size:12px;color:#8f8299;margin-top:12px;text-align:center}@media(max-width:780px){.grid{grid-template-columns:1fr}.visual{min-height:330px}.icon{font-size:120px}.info h1{font-size:38px}}</style></head><body><header class="top"><nav class="nav"><a class="logo" href="index.html">NUV<span>O</span>RA</a><a class="back" href="index.html#loja">← Voltar para a loja</a></nav></header><main class="wrap"><div class="grid"><section class="visual"><div class="icon" id="icon">✦</div></section><section class="info"><div class="tag" id="tag" style="display:none"></div><div class="cat" id="cat"></div><h1 id="name">Carregando…</h1><p class="desc" id="desc"></p><div class="price" id="price">R$ 0,00</div><a class="buy" id="buy" href="#">Comprar agora</a><div class="note">Pix com QR Code e copia e cola • Cartão de crédito e débito dentro da NUVORA</div></section></div></main><script>const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v);(async()=>{const id=new URLSearchParams(location.search).get('id')||'1';const p=(await fetch('data/products.json').then(r=>r.json())).find(x=>x.id===id)||null;if(!p)return;document.title=p.name+' | NUVORA';icon.textContent=p.icon;cat.textContent=p.category;name.textContent=p.name;desc.textContent=p.description;price.textContent=money(p.price);if(p.tag){tag.textContent=p.tag;tag.style.display='inline-block'}buy.href='checkout.html?id='+encodeURIComponent(p.id)+'&qty=1'})();</script></body></html>
